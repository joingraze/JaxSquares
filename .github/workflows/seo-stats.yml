name: Refresh squares stats

# Once a year, after the NFL season's last game, recounts how often every
# square hits on a final score (scripts/seo/stats.ts) from nflverse's
# games.csv, and opens a pull request when the numbers changed. The data page
# (/best-football-squares-numbers) and the marketing studio's stat videos read
# them. Also runs by hand (Actions → Refresh squares stats → Run workflow).
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Settings → Actions → General (docs/seo.md).
on:
  schedule:
    # March 1, 14:17 UTC: the season's last game is in mid-February.
    - cron: "17 14 1 3 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recount the final scores
        run: |
          curl -fsSL https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv -o "$RUNNER_TEMP/games.csv"
          npm run seo:stats -- "$RUNNER_TEMP/games.csv"

      - name: Verify
        run: npm run typecheck && npm run test

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The numbers haven't changed."
            exit 0
          fi
          branch="seo-stats-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Squares stats: recount the NFL final scores"
          git push -u origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "Squares stats: recount the NFL final scores" \
            --body "Recounted from nflverse's games.csv by .github/workflows/seo-stats.yml. Updates scripts/seo/data/nflFinals.ts: the data page /best-football-squares-numbers, its CSV, and the marketing studio's stat videos. Merging ships it with the next deploy."
