name: Deploy

# Deploys the JaxSquares Worker to Cloudflare. Runs in GitHub's cloud — no
# local toolchain needed. Requires a single repository secret,
# CLOUDFLARE_API_TOKEN, with Workers Scripts + D1 edit permissions, scoped to
# your account (so wrangler can infer the account id).
on:
  push:
    branches:
      - main
      - claude/relaxed-meitner-0wwvuy
      # The v1 line of work deploys until it is merged into the default branch.
      - claude/determined-fermat-b0si26
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run test

      # Use the "jaxsquares" D1 database in the token's account, creating it on
      # first deploy, and point wrangler.jsonc at it for this run.
      - name: Ensure the D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e "
              const list = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const db = list.find((d) => d.name === 'jaxsquares');
              process.stdout.write(db ? db.uuid : '');"
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create jaxsquares
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "Could not find or create the jaxsquares D1 database"; exit 1; }
          echo "D1 jaxsquares database_id: $id"
          node -e "
            const fs = require('fs');
            const p = 'wrangler.jsonc';
            fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace(/\"database_id\": \"[^\"]+\"/, '\"database_id\": \"' + process.argv[1] + '\"'));" "$id"
          grep -n database_id wrangler.jsonc

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply jaxsquares --remote

      # SEO_PREVIOUS_MANIFEST: each page keeps its sitemap date unless it
      # changed since the live site, and only changed pages get an IndexNow
      # ping (scripts/seo/build.ts, docs/seo.md).
      - name: Build and deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          SEO_PREVIOUS_MANIFEST: https://jaxsquares.com/seo/pages.json
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          preCommands: npm run build

      # Read-only checks against the live Worker (no data is written).
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$URL/api/health" && break
            sleep 5
          done
          echo
          curl -fsS "$URL/api/health" | grep -q '"ok":true'
          curl -fsS "$URL/api/config" | head -c 300; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/g/abc234")" = 200
          # A landing page is its own static file, not the SPA fallback.
          curl -fsS "$URL/football-squares" | grep -q 'rel="canonical" href="https://jaxsquares.com/football-squares"'
          # The homepage is home.html (its own canonical), boards stay out of search, and AI crawlers get llms.txt.
          # (grep reads to the end, so curl never hits a closed pipe.)
          curl -fsS "$URL/" | grep 'rel="canonical" href="https://jaxsquares.com/"' >/dev/null
          curl -sS -o /dev/null -D - "$URL/g/abc234" | grep -i '^x-robots-tag: noindex' >/dev/null
          curl -fsS "$URL/llms.txt" | grep '^# JaxSquares' >/dev/null
          curl -fsS "$URL/nfl-squares" | grep 'id="week-games"' >/dev/null
          echo "Live: $URL"

      # jaxsquares.com: once it's an active zone in this Cloudflare account,
      # attach it to the Worker (idempotent). Until then the log prints the
      # domain's DNS and what's left to do (docs/domain.md). Never fails the deploy.
      - name: Custom domain (jaxsquares.com)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/custom-domain.sh

      # Tell IndexNow (Bing, which ChatGPT search reads, plus Yandex and
      # others) which pages changed in this deploy. Skips itself until
      # jaxsquares.com serves the key file. Never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: node --experimental-strip-types scripts/seo/indexnow.ts
