name: Deploy

# Deploys the JaxSquares Worker to Cloudflare. Runs in GitHub's cloud — no
# local toolchain needed. Requires a single repository secret,
# CLOUDFLARE_API_TOKEN, with Workers Scripts + D1 edit permissions, scoped to
# your account (so wrangler can infer the account id).
on:
  push:
    branches:
      - main
      - claude/relaxed-meitner-0wwvuy
      # Temporary: deploy the v1 build from its working branch.
      - claude/determined-fermat-b0si26
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run typecheck && npm run test

      # Use the "jaxsquares" D1 database in the token's account, creating it on
      # first deploy, and point wrangler.jsonc at it for this run.
      - name: Ensure the D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e "
              const list = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const db = list.find((d) => d.name === 'jaxsquares');
              process.stdout.write(db ? db.uuid : '');"
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create jaxsquares
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "Could not find or create the jaxsquares D1 database"; exit 1; }
          echo "D1 jaxsquares database_id: $id"
          node -e "
            const fs = require('fs');
            const p = 'wrangler.jsonc';
            fs.writeFileSync(p, fs.readFileSync(p, 'utf8').replace(/\"database_id\": \"[^\"]+\"/, '\"database_id\": \"' + process.argv[1] + '\"'));" "$id"
          grep -n database_id wrangler.jsonc

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply jaxsquares --remote

      - name: Build and deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          preCommands: npm run build
