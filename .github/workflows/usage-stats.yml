name: Usage stats

# Read-only totals from the production database: accounts (signed in with
# Apple or Google), devices, players, hosts, boards and active passes. Counts
# only: never an id, a clientId, an email or a name (this repo and its logs are
# public). Starts when this file changes.
on:
  push:
    branches:
      - claude/determined-fermat-b0si26
    paths:
      - .github/workflows/usage-stats.yml
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Totals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx -y wrangler@4 d1 execute jaxsquares --remote --json --command "
            SELECT
              (SELECT count(*) FROM accounts) AS accounts,
              (SELECT count(*) FROM accounts WHERE created_at > (strftime('%s', 'now') - 7 * 86400) * 1000) AS accounts_new_7d,
              (SELECT count(*) FROM accounts WHERE created_at > (strftime('%s', 'now') - 30 * 86400) * 1000) AS accounts_new_30d,
              (SELECT count(DISTINCT account_id) FROM account_identities WHERE provider = 'google') AS accounts_with_google,
              (SELECT count(DISTINCT account_id) FROM account_identities WHERE provider = 'apple') AS accounts_with_apple,
              (SELECT count(*) FROM client_links) AS signed_in_devices,
              (SELECT count(DISTINCT client_id) FROM players) AS players,
              (SELECT count(DISTINCT host_client_id) FROM games WHERE season_id IS NULL) AS hosts,
              (SELECT count(*) FROM games WHERE season_id IS NULL) AS boards,
              (SELECT count(*) FROM games WHERE season_id IS NULL AND created_at > (strftime('%s', 'now') - 7 * 86400) * 1000) AS boards_new_7d,
              (SELECT count(*) FROM host_passes WHERE status = 'active') AS active_passes
          " | jq '.[0].results[0]' | tee -a "$GITHUB_STEP_SUMMARY"
