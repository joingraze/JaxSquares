name: Probe schedule

# One-off diagnostic: runs the repo's ESPN parser against real ESPN responses
# (fetched without a custom User-Agent). Runs only when this file changes.
on:
  push:
    branches:
      - claude/determined-fermat-b0si26
    paths:
      - .github/workflows/probe-schedule.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch real ESPN responses
        run: |
          mkdir -p probe
          from=$(date -u -d '-1 day' +%Y%m%d); to=$(date -u -d '+10 day' +%Y%m%d)
          B=https://site.api.espn.com/apis/site/v2/sports/football
          curl -s -o probe/nfl.json  -w 'nfl range %{http_code} %{size_download}B\n'   "$B/nfl/scoreboard?dates=$from-$to&limit=1000"
          curl -s -o probe/ncaaf.json -w 'ncaaf range %{http_code} %{size_download}B\n' "$B/college-football/scoreboard?dates=$from-$to&limit=1000&groups=80"
          live=$(jq -r '[.events[] | select(.status.type.state=="in")][0].id // ([.events[]][0].id)' probe/ncaaf.json)
          echo "summary event: $live"
          curl -s -o probe/summary.json -w 'summary %{http_code} %{size_download}B\n' "$B/college-football/summary?event=$live"
          echo "--- trimmed NFL fixture (first 2 events):"
          jq -c '{events: [.events[:2][] | {id, date, name, shortName, status, competitions: [.competitions[0] | {competitors: [.competitors[] | {homeAway, score, linescores, team: (.team | {displayName, abbreviation, color, location, name})}]}]}]}' probe/nfl.json | head -c 4000; echo

      - name: Run the repo's parser on them
        run: |
          cat > worker/scores/probe.live.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { it } from "vitest";
          import { parseSchedule, parseScoreboardSnapshots, parseSummarySnapshot, toLiveUpdate } from "./espn";
          const load = (f: string) => JSON.parse(readFileSync(`probe/${f}`, "utf8"));
          it("parses real ESPN data", () => {
            for (const [file, league] of [["nfl.json", "nfl"], ["ncaaf.json", "ncaaf"]] as const) {
              const raw = load(file);
              const all = parseSchedule(raw, league);
              const upcoming = all.filter((e) => e.state !== "post");
              console.log(`${league}: raw events ${raw.events?.length}, parsed ${all.length}, not finished ${upcoming.length}`);
              for (const e of upcoming.slice(0, 4)) console.log("  ", new Date(e.startsAt).toISOString(), e.state, e.away.abbr, e.away.color, "@", e.home.abbr, e.home.color, "|", e.name);
            }
            const snaps = parseScoreboardSnapshots(load("ncaaf.json"));
            const live = snaps.find((s) => s.live?.state === "in") ?? snaps[0];
            console.log("scoreboard snapshot:", JSON.stringify(live).slice(0, 600));
            if (live) console.log("live update:", JSON.stringify(toLiveUpdate(live, true, Date.now())).slice(0, 600));
            console.log("summary snapshot:", JSON.stringify(parseSummarySnapshot(load("summary.json"))).slice(0, 600));
          });
          EOF
          npx vitest run worker/scores/probe.live.test.ts --reporter=verbose 2>&1 | grep -v "^ *$" | head -80
