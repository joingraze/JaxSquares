name: Probe schedule

# Diagnostic: runs the app's real schedule + live-score code against ESPN from a
# GitHub runner (the build sandbox can't reach ESPN). Runs when this file or the
# scores module changes on the v1 branch.
on:
  push:
    branches:
      - claude/determined-fermat-b0si26
    paths:
      - .github/workflows/probe-schedule.yml
      - worker/scores/**

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: App code against real ESPN
        run: |
          cat > worker/scores/probe.live.test.ts <<'EOF'
          // @vitest-environment node
          import { it } from "vitest";
          import { fetchLiveForEvent, getSchedule } from "./index";
          it("real ESPN through the app code", async () => {
            for (const league of ["nfl", "ncaaf"] as const) {
              const result = await getSchedule(league);
              if (!result) { console.log(`${league}: UNAVAILABLE`); throw new Error(`${league} schedule unavailable`); }
              const { events, week, weeks } = result;
              console.log(`${league}: ${week?.label} ${events.length} games; later: ${weeks.map((w) => w.label).join(", ")}`);
              console.log(`  first: ${events.slice(0, 3).map((e) => `${e.shortName} ${new Date(e.startsAt).toISOString()} ${e.state} ${e.venue?.city ?? ""}${e.neutralSite ? " (neutral)" : ""} ${JSON.stringify(e.ranks ?? {})}`).join(" | ")}`);
              if (events.length === 0) throw new Error(`${league} schedule empty`);
              if (weeks.length === 0) throw new Error(`${league} has no later weeks`);
              const next = await getSchedule(league, weeks[0].id);
              console.log(`  ${weeks[0].label}: ${next?.events.length} games; first ${next?.events[0]?.shortName}`);
              if (!next?.events.length) throw new Error(`${league} ${weeks[0].id} empty`);
              const ranked = [...events, ...next.events].filter((e) => e.ranks).length;
              console.log(`  ranked games: ${ranked}; neutral: ${[...events, ...next.events].filter((e) => e.neutralSite).map((e) => `${e.shortName} @ ${e.venue?.name}, ${e.venue?.city}`).join("; ")}`);
              const pick = events.find((e) => e.state === "in") ?? events[0];
              const update = await fetchLiveForEvent({ provider: "espn", league, eventId: pick.eventId, startsAt: pick.startsAt, xIsHome: true });
              console.log(`  live ${pick.shortName}: ${JSON.stringify(update)?.slice(0, 300)}`);
              if (!update) throw new Error(`${league} live lookup returned null for ${pick.eventId}`);
            }
          }, 60_000);
          EOF
          npx vitest run worker/scores/probe.live.test.ts 2>&1 | grep -E "nfl:|ncaaf:|first:|Week|Wild|Bowls|CFP|ranked|live |✓|×|Error|FAIL" | head -40
          npx vitest run worker/scores/probe.live.test.ts > /dev/null 2>&1
